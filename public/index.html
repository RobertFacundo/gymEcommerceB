<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Gym Ecommerce</title>
  <link rel="icon" type="image/png" href="/images/capacitacion.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.25)),
                  url('/images/backgroundImage.jpg') center/cover no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    .card {
      background: rgba(255, 255, 255, 0.7);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      padding: 32px;
      max-width: 620px;
      width: 90%;
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.25);
    }

    .card p {
      margin: 16px 0;
      color: #222;
    }

    .btn {
      font-size: 18px;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 14px 28px;
      background-color: #e74c3c;
      border-radius: 8px;
      display: inline-block;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
      transition: all 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(0,0,0,0.3);
      background-color: #d84335;
    }

    @media (max-width: 480px) {
      .card {
        padding: 24px;
      }
      .btn {
        padding: 12px 24px;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <p style="font-size: 20px; font-weight: 600;">
      ⚠️ This backend is hosted for <span style="color:#e74c3c;">FREE on Render</span><br/>
      and may take a few seconds due to cold start.
    </p>

    <p style="font-size: 18px;">
      The backend is now ready.<br/>
      You can safely proceed to the frontend:
    </p>

    <a class="btn" href="https://music-app-f.vercel.app/" target="_blank">
      👉 Go to the website
    </a>

    <p style="font-size: 14px; margin-top: 28px;">
      Thank you for your patience 🙏
    </p>
  </div>
</body>

</html>
